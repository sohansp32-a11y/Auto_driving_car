[project]
name = "self-driving-car"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sohan SP", email = "sohansp32@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pygame>=2.6.1",
]

[project.scripts]
self-driving-car = "self_driving_car:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
self-driving-car = { workspace = true }

[dependency-groups]
dev = [
    "self-driving-car",
]
